app = "route-runner-graphhopper"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  JAVA_OPTS = "-Xmx3g -Xms1g"

[http_service]
  internal_port = 8989
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  grace_period = "120s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health"
  protocol = "http"

[[mounts]]
  source = "graphhopper_data"
  destination = "/data"
  initial_size = "10gb"

[[vm]]
  size = "performance-2x"
  memory = "4gb"
